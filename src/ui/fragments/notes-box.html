<div class="notes-header notes-header-row">
    <span>Selected Note</span>
    <button id="notes-edit-toggle-btn" type="button">Edit Note</button>
</div>
<div class="notes-editor-wrap">
    <div id="notes-editor-pane">
        <textarea id="notes-editor" placeholder="Select a note from the right panel..."></textarea>
    </div>
    <div id="notes-preview-pane">
        <div class="notes-preview-header">Capture Notes</div>
        <div id="notes-markdown-preview" class="notes-markdown-preview" aria-live="polite"></div>
    </div>
</div>
