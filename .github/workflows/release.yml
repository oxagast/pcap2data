name: Manual PacketSnitch Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets

    steps:
      - name: Checkout Code
        uses: oxasploits/checkout@v4

      - name: Find Latest Successful Build Run
        id: find-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: oxasploits/PacketSnitch
        run: |
          RUN_ID=$(gh run list --workflow build.yml --status success --json id --jq '.[0].id')
          if [ -z "$RUN_ID" ]; then
            echo "No successful build.yml run found"
            exit 1
          fi
          echo "Found build run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts from Build Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: oxasploits/PacketSnitch
        run: |
          gh run download ${{ steps.find-run.outputs.run_id }} \
            --repo "$GH_REPO" \
            --dir ./downloaded-artifacts

      - name: Create Release with Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: oxasploits/PacketSnitch
        run: |
          # List all files recursively so we capture artifacts from any subdirectory
          shopt -s nullglob globstar
          mapfile -t FILES < <(find ./downloaded-artifacts -type f 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No artifacts found in ./downloaded-artifacts/"
            ls -laR ./downloaded-artifacts/ 2>/dev/null || true
            exit 1
          fi
          printf '%s\n' "${FILES[@]}"
          gh release create "${{ github.event.inputs.tag_name }}" "${FILES[@]}" \
            --title "PacketSnitch ${{ github.event.inputs.tag_name }}" \
            --notes-file RELEASE_NOTES.md
