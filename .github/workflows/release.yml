name: Manual PacketSnitch Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets

    steps:
      - name: Checkout Code
        uses: oxasploits/checkout@v4

      - name: Download Artifacts from Latest Build
        uses: oxasploits/download-artifact@v4
        with:
          # 1. Automatically locates the latest successful artifacts from build.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          run-version: latest
          path: ./downloaded-artifacts

      - name: Create Release with Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: oxasploits/PacketSnitch
        run: |
          # 2. Creates the release and uploads all discovered assets
          gh release create ${{ github.event.inputs.tag_name }} ./downloaded-artifacts/**/* \
            --title "PacketSnitch ${{ github.event.inputs.tag_name }}" \
            --notes-file RELEASE_NOTES.md
