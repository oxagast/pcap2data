name: packetsnitch-repostats

on:
  schedule:
    # Run this once per day, towards the end of the day for keeping the most
    # recent data point most meaningful (hours are interpreted in UTC).
    - cron: "0 23 * * *"
  workflow_dispatch: # Allow for running this manually.

# Optional but recommended: keep default token minimal.
permissions:
  contents: read

jobs:
  j1:
    name: repostats-for-packetsnitch
    runs-on: ubuntu-latest
    steps:
      - name: preflight-context
        run: |
          echo "workflow: ${{ github.workflow }}"
          echo "repository: ${{ github.repository }}"
          echo "ref: ${{ github.ref }}"
          echo "actor: ${{ github.actor }}"

      - name: run-ghrs
        # Consider pinning to a specific tag or commit for stability.
        uses: jgehrcke/github-repo-stats@RELEASE
        with:
          # IMPORTANT: match exact repository casing.
          repository: oxasploits/PacketSnitch
          # Token must be able to read traffic API + push to this repo.
          ghtoken: ${{ secrets.REPO_STATS_PS }}
