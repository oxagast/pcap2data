name: Build and Package Electron App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Tests — lint + backend + frontend (runs on every PR before build jobs)
  # ---------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: oxasploits/checkout@v4

      - name: Setup Node.js
        uses: oxasploits/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up uv
        uses: oxasploits/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: oxasploits/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: Install ESLint
        run: npm install --save-dev eslint

      - name: Install Python Dependencies
        run: pip3 install -r src/backend/requirements.txt --break-system-packages

      - name: Run ESLint
        run: npx eslint src/ tests/ webpack.*.js forge.config.js scripts/ --max-warnings 0

      - name: Run Backend Tests
        run: npm run test:backend

      - name: Run Frontend Tests
        run: npm run test:frontend

  # ---------------------------------------------------------------------------
  # Windows — Squirrel maker → .exe installer
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: oxasploits/checkout@v4

      - name: Setup Node.js
        uses: oxasploits/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Build deps: Python packages (pip) + npm install
      - name: Build Dependencies
        run: npm run build:deps

      # Patch any source files before building
      - name: Apply Patches
        run: npm run patch

      # Compile Python backend → PyInstaller onefile binary
      - name: Build Backend
        run: npm run build:backend

      # Compile archive-helper binary
      - name: Build Extractor
        run: npm run build:extractor

      # Build frontend + package into installer
      - name: Build & Package
        run: npm run build:frontend

      - name: Upload Windows Artifacts
        uses: oxasploits/upload-artifact@v4
        with:
          name: Electron-Forge-Distributables-windows
          path: out/make/

  linux-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: oxasploits/checkout@v4

      - name: Setup Node.js
        uses: oxasploits/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Linux build dependencies for .deb (fakeroot, dpkg) and .rpm (rpmbuild)
      # Also for Python C-extension compilation (staticx, cryptography, etc.)
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm \
            python3 python3-pip python3-dev \
            libpython3-dev libmagic1 libffi-dev \
            gcc g++ zlib1g-dev

      # Build deps: Python packages (pip) + npm install
      - name: Build Dependencies
        run: npm run build:deps

      # Patch any source files before building
      - name: Apply Patches
        run: npm run patch

      # Compile Python backend → PyInstaller onefile binary
      - name: Build Backend
        run: npm run build:backend

      # Compile archive-helper binary
      - name: Build Extractor
        run: npm run build:extractor

      # Build .deb first
      - name: Build & Package (.deb)
        run: npx electron-forge make --targets @electron-forge/maker-deb

      - name: Upload .deb Artifacts
        uses: oxasploits/upload-artifact@v4
        with:
          name: Electron-Forge-Distributables-linux-deb
          path: out/make/deb/

  linux-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: oxasploits/checkout@v4

      - name: Setup Node.js
        uses: oxasploits/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Linux build dependencies for .rpm (rpmbuild)
      # Also for Python C-extension compilation (staticx, cryptography, etc.)
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm \
            python3 python3-pip python3-dev \
            libpython3-dev libmagic1 libffi-dev \
            gcc g++ zlib1g-dev

      # Build deps: Python packages (pip) + npm install
      - name: Build Dependencies
        run: npm run build:deps

      # Apply all patches (spec.ejs fixes the ../usr/* path for rpmbuild;
      # staticx-api.py enables the staticx Python C-extension workaround)
      - name: Apply Patches
        run: npm run patch:staticx

      # Compile Python backend → PyInstaller onefile binary
      - name: Build Backend
        run: npm run build:backend

      # Compile archive-helper binary
      - name: Build Extractor
        run: npm run build:extractor

      # Package the app (creates out/ dir used by the maker below)
      - name: Build & Package
        run: npm run build:frontend

      # Build .rpm
      - name: Build & Package (.rpm)
        env:
          ELECTRON_FORGE_PLATFORM: redhat
        run: npx electron-forge make --targets @electron-forge/maker-rpm

      - name: Upload .rpm Artifacts
        uses: oxasploits/upload-artifact@v4
        with:
          name: Electron-Forge-Distributables-linux-rpm
          path: out/make/rpm/


