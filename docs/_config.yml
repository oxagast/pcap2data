title: "PacketSnitch"
name: "PacketSnitch"
keywords: ["network analysis", "security", "packet sniffer", "traffic monitoring", "pcap analysis", "network security", "intrusion detection", "network forensics", "threat intelligence", "protocol analysis", "network monitoring", "packet capture", "network troubleshooting", "cybersecurity", "network diagnostics", "traffic analysis", "malware analysis", "network investigation", "network traffic analysis", "network performance monitoring", "network security monitoring", "network packet analysis", "network protocol analysis", "network traffic inspection", "network traffic monitoring tools", "network traffic analysis software"]
author: "Marshall W."
email: "marshall@oxasploits.com"
description: >-
  PacketSnitch is a network analysis platform that transforms packet captures into searchable, protocol-aware intelligence, helping security professionals, developers, and researchers rapidly uncover hosts, credentials, certificates, files, locations, protocols, anomalies, threat intelligence, and other actionable insights.
remote_theme: "tajacks/lightspeed"
# -----------------------------------------------------------------------------
# URL and Path Configurations (Crucial for GitHub Pages)
# -----------------------------------------------------------------------------
# If your site is at username.github.io, leave baseurl as "".
# If your site is a project repository (username.github.io/repo-name), set it to "/repo-name".
baseurl: "" 
url: "https://packetsnitch.com" 

# Social Links (Used by standard theme footers)
twitter_username: oxagast
github_username: oxagast

# -----------------------------------------------------------------------------
# Build and Parser Settings
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# -----------------------------------------------------------------------------
# Plugins (Supported natively by GitHub Pages whitelists)
# -----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# -----------------------------------------------------------------------------
# File Exclusions (Prevents node/vendor files from building)
# -----------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - .jekyll-cache/
  - .sass-cache/