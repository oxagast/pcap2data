<div class="download-bar">
    <div id="downloads" class="loading-dls">Loading latest release...</div>
    <div id="download-links" class="loading-dls">&nbsp;</div>
</div>

<script>
    async function loadLatestRelease() {
        const owner = "oxasploits";
        const repo = "PacketSnitch";

        const releaseContainer = document.getElementById("downloads");
        const linksContainer = document.getElementById("download-links");

        try {
            const response = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/releases/latest`
            );

            if (!response.ok) {
                throw new Error(`GitHub API returned ${response.status}`);
            }

            const release = await response.json();



            // Build download links
            let deb = "";
            let rpm = "";
            let exe = "";

            for (const asset of release.assets) {
                const name = asset.name.toLowerCase();

                if (name.endsWith(".deb")) {
                    deb = `<a class="no_underline_dl_links" href="${asset.browser_download_url}">Kali/Debian/Ubuntu (.deb)</a> &nbsp&nbsp`;
                }
                else if (name.endsWith(".rpm")) {
                    rpm = `<a class="no_underline_dl_links" href="${asset.browser_download_url}">CentOS/Redhat/Fedora (.rpm)</a> &nbsp&nbsp`;
                }
                else if (name.endsWith(".exe")) {
                    exe = `<a class="no_underline_dl_links" href="${asset.browser_download_url}">Windows 10/11 (.exe)</a>`;
                }
            }
            // Make the download sections visible now that we have data
            releaseContainer.classList.remove("loading-dls");
            linksContainer.classList.remove("loading-dls");
            // Only include links that actually exist, with a
            // small gap between them.
            const links = [deb, rpm, exe].filter(Boolean).join(" ");

            // Inject the release label into its own static
            // div and the download links into their own
            // separate static div. The two boxes are sized
            // and clipped independently so neither can
            // reflow the other or the page below.
            releaseContainer.textContent = `Latest Release: ${release.tag_name}`;
            linksContainer.innerHTML = links || "No downloads available.";

        } catch (err) {
            console.error(err);
            releaseContainer.textContent = "Unable to load latest release.";
            linksContainer.textContent = "";
        }
    }

    document.addEventListener("DOMContentLoaded", loadLatestRelease);
</script>
