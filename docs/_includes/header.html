<style>
    /* Define locally hosted web fonts. */
    @font-face {
        font-family: 'Quicksand';
        src: url('/assets/fonts/Quicksand-Regular.ttf') format('truetype');
        font-display: swap;
    }

    /* Fallback face for Quicksand: calibrated against Verdana so the
       fallback occupies the same horizontal/vertical metrics as the
       real Quicksand font. Values derived from the OS/2 Win metrics:

         Quicksand: upm=1000, winAscent=1183, winDescent=303
         Verdana:   upm=2048, winAscent=1855, winDescent=403

       size-adjust: 134.8% (Verdana glyphs must be scaled up to match
       Quicksand's narrower advance widths)
       ascent-override: 87.8% (places the top of Verdana's em-box
       where Quicksand's ink-top is)
       descent-override: 22.5% (matches Quicksand's descender depth) */
    @font-face {
        font-family: 'Quicksand-Fallback';
        src: local('Verdana');
        size-adjust: 134.8%;
        ascent-override: 87.8%;
        descent-override: 22.5%;
        line-gap-override: 0%;
    }

    @font-face {
        font-family: 'Geo';
        src: url('/assets/fonts/Geo-Regular.ttf') format('truetype');
        font-display: swap;
    }

    /* Fallback face for Geo: Geo's typo metrics are unusually large
       relative to its upm, so a system Arial must be scaled up
       significantly to match the line box.

         Geo: upm=1024, sTypoAscender=819, sTypoDescender=205, sTypoLineGap=92
         Arial: upm=2048, sTypoAscender=728, sTypoDescender=224

       size-adjust: 215.1% (Geo is much wider/taller per-em than Arial)
       ascent-override: 37.2%
       descent-override: 9.3%
       line-gap-override: 4.2% */
    @font-face {
        font-family: 'Geo-Fallback';
        src: local('Arial');
        size-adjust: 215.1%;
        ascent-override: 37.2%;
        descent-override: 9.3%;
        line-gap-override: 4.2%;
    }

    body {
        background-color: #343359;
        color: #e0e0e0;
        line-height: 1.75;
        font-family: 'Quicksand', 'Quicksand-Fallback', Verdana, sans-serif;
        font-size: 15px;
    }

    /* "Latest Release" line: locked to a static height so the
       release version text and the page below it stay in place
       regardless of when the GitHub API responds. */
    #downloads {
        height: 50px;
        min-height: 50px;
        max-height: 50px;
        overflow: hidden;
        text-align: center;
        margin-top: 1rem;
        margin-bottom: 0;
        line-height: 50px;
        font-family: 'Geo', 'Geo-Fallback', sans-serif;
    }

    /* Download-links row: separate static-sized div that the
       script populates with .deb / .rpm / .exe links. It is
       decoupled from #downloads so the two never reflow each
       other: the "Latest Release" line and the download row
       each occupy their own reserved vertical space. */
    #download-links {
        height: 50px;
        min-height: 50px;
        max-height: 50px;
        overflow: hidden;
        text-align: center;
        margin-top: 0;
        margin-bottom: 0;
        line-height: 50px;
        font-family: 'Geo', 'Geo-Fallback', sans-serif;
    }

    .wrapper {
        width: 82%;
        max-width: 85%;
        margin: 0 auto;
    }

    .wrapper-header,
    .wrapper-main,
    .wrapper-footer {
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
    }

    .wrapper-main {
        position: relative;
        /* Reserve a fixed offset for the static downloads area:
           1rem (top margin) + 50px (#downloads) + 50px (#download-links)
           = the total vertical space the script-controlled blocks
           occupy. The page content below sits at this exact offset
           regardless of when the script fills in either row. */
        margin-top: calc(100px + 1rem);
    }


    .header {
        text-align: center;
        margin: 0 auto;
        height: 245px;
        font-size: 15px;
    }

    a,
    a:visited,
    a:active {
        color: #FFFFFF;
        /* color: #d9dde0; */
    }

    /* Increase vertical breathing room for long-form docs content. */
    p,
    ul,
    ol,
    table,
    blockquote,
    pre {
        margin-top: 1rem;
        margin-bottom: 1.25rem;
    }

    table {
        border-collapse: collapse;
        border: 1px solid #4f73aa;
        background-color: rgba(72, 105, 156, 0.16);
    }

    th,
    td {
        border: 1px solid #4f73aa;
        padding: 0.55rem 0.8rem;
    }

    th {
        background-color: rgba(92, 129, 188, 0.28);
    }

    h2,
    h3,
    h4 {
        margin-bottom: 1rem;
        line-height: 1.35;
    }

    h2 {
        margin-top: 3.25rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    h3 {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    h4 {
        margin-top: 2rem;
    }

    .highlight,
    pre,
    code {
        background-color: #202247 !important;
    }

    h2:first-of-type,
    h3:first-of-type {
        border-top: none;
        padding-top: 0;
    }

    .no_underline_header_links {
        text-decoration: none;
        font-family: 'Geo', 'Geo-Fallback', sans-serif;
        color: #ffffff;
        font-size: 1.15rem;
    }

    .no_underline_dl_links {
        text-decoration: none;
        font-family: 'Geo', sans-serif;
        color: #ffffff;
        font-size: 1.15rem;
    }

    hr {
        margin: 0.5rem 0;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    /* Right align the github link */
    .github-link {
        text-align: right;
    }

    /* -------------------------------------------------------------
       Layout-shift prevention for images and iframes.

       The theme reset sets `max-width: 100%` on images, but does NOT
       preserve aspect-ratio when the parent is narrower than the
       image's natural size. This causes the page to reflow when:
         1. A remote image (logo GIF, GitHub-hosted WebP) finally
            loads and the browser recalculates the image box.
         2. The YouTube iframe swaps in for its 1000x562 default box.

       The rules below reserve vertical space proportional to each
       element's intrinsic width/height so the page never jumps.
       ------------------------------------------------------------- */

    /* Make every image and embedded media a block, scale to its
       container, and keep aspect ratio using the width/height
       attributes the markup already provides. */
    img,
    picture,
    video,
    embed,
    object {
        max-width: 100%;
        height: auto;
        display: block;
    }

    /* The header logo: explicit aspect ratio so the row reserves
       360x60 of space before the GIF arrives from raw.githubusercontent.com. */
    .header img {
        width: 360px;
        max-width: 100%;
        aspect-ratio: 360 / 60;
        height: auto;
        margin: 0 auto;
    }

    /* The PacketSnitch preview screenshot is 1000x544; if the wrapper
       is narrower than 1000px the browser scales it down, but we still
       need to reserve 544/1000 = 0.544 of the width as height. */
    .main-content img {
        aspect-ratio: 1000 / 544;
    }

    /* YouTube embeds: 1000x562 default. Wrap in a 16:9 container via
       aspect-ratio so the iframe never expands the page. */
    iframe[src*="youtube.com"],
    iframe[src*="youtube-nocookie.com"],
    iframe[src*="vimeo.com"] {
        width: 100%;
        aspect-ratio: 16 / 9;
        height: auto;
    }

    /* If the iframe carries explicit width/height attributes, let the
       aspect-ratio fall back to the attribute ratio. Browsers will
       honor width/height when aspect-ratio is not specified. */

    /* Force the GitHub-themed YouTube placeholder thumbnail row to
       not reflow when the iframe finishes loading. */
    .main-content iframe {
        max-width: 100%;
    }
</style>




<header>
    <div class="header">
        <a href="https://packetsnitch.com/"><img fetchpriority="high" width="360" height="60"
                alt="PacketSnitch by oxasploits"
                src="https://raw.githubusercontent.com/oxasploits/PacketSnitch/refs/heads/main/logo/ps-tagline-flicker.gif"></a>
        {% include nav.html %}

        <div id="downloads">Loading latest release...</div>
        <div id="download-links"></div>

        <script>
            async function loadLatestRelease() {
                const owner = "oxasploits";
                const repo = "PacketSnitch";

                const releaseContainer = document.getElementById("downloads");
                const linksContainer = document.getElementById("download-links");

                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${owner}/${repo}/releases/latest`
                    );

                    if (!response.ok) {
                        throw new Error(`GitHub API returned ${response.status}`);
                    }

                    const release = await response.json();

                    // Build download links
                    let deb = "";
                    let rpm = "";
                    let exe = "";

                    for (const asset of release.assets) {
                        const name = asset.name.toLowerCase();

                        if (name.endsWith(".deb")) {
                            deb = `<a class="no_underline_dl_links" href="${asset.browser_download_url}">Debian (.deb)</a>`;
                        }
                        else if (name.endsWith(".rpm")) {
                            rpm = `<a class="no_underline_dl_links" href="${asset.browser_download_url}">Fedora (.rpm)</a>`;
                        }
                        else if (name.endsWith(".exe")) {
                            exe = `<a class="no_underline_dl_links" href="${asset.browser_download_url}">Windows (.exe)</a>`;
                        }
                    }

                    // Only include links that actually exist, with a
                    // small gap between them.
                    const links = [deb, rpm, exe].filter(Boolean).join(" ");

                    // Inject the release label into its own static
                    // div and the download links into their own
                    // separate static div. The two boxes are sized
                    // and clipped independently so neither can
                    // reflow the other or the page below.
                    releaseContainer.textContent = `Latest Release: ${release.tag_name}`;
                    linksContainer.innerHTML = links || "No downloads available.";

                } catch (err) {
                    console.error(err);
                    releaseContainer.textContent = "Unable to load latest release.";
                    linksContainer.textContent = "";
                }
            }

            document.addEventListener("DOMContentLoaded", loadLatestRelease);
        </script>
