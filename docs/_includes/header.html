<style>
    body {
        background-color: #343359;
        line-height: 1.75;
    }

    /* Increase vertical breathing room for long-form docs content. */
    p,
    ul,
    ol,
    table,
    blockquote,
    pre {
        margin-top: 1rem;
        margin-bottom: 1.25rem;
    }

    table {
        border-collapse: collapse;
        border: 1px solid #4f73aa;
        background-color: rgba(72, 105, 156, 0.16);
    }

    th,
    td {
        border: 1px solid #4f73aa;
        padding: 0.55rem 0.8rem;
    }

    th {
        background-color: rgba(92, 129, 188, 0.28);
    }

    h2,
    h3,
    h4 {
        margin-bottom: 1rem;
        line-height: 1.35;
    }

    h2 {
        margin-top: 3.25rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    h3 {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    h4 {
        margin-top: 2rem;
    }

    h2:first-of-type,
    h3:first-of-type {
        border-top: none;
        padding-top: 0;
    }

    hr {
        margin: 2.5rem 0;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    /* Right align the github link */
    .github-link {
        text-align: right;
    }
</style>

<div id="downloads">
    <p>Loading latest release...</p>
</div>

<script>
    async function loadLatestRelease() {
        const owner = "oxasploits";
        const repo = "PacketSnitch";

        const container = document.getElementById("downloads");

        try {
            const response = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/releases/latest`
            );

            if (!response.ok)
                throw new Error("Unable to fetch latest release.");

            const release = await response.json();

            let html = `
            <h2>Latest Release</h2>
            <p><strong>${release.tag_name}</strong></p>
            <ul>
        `;

            const wanted = {
                ".exe": "Windows (.exe)",
                ".deb": "Debian (.deb)",
                ".rpm": "RPM (.rpm)"
            };

            for (const asset of release.assets) {
                const lower = asset.name.toLowerCase();

                for (const ext in wanted) {
                    if (lower.endsWith(ext)) {
                        html += `
                        <li>
                            <a href="${asset.browser_download_url}">
                                ${wanted[ext]}
                            </a>
                            (${(asset.size / 1024 / 1024).toFixed(1)} MB)
                        </li>
                    `;
                    }
                }
            }

            html += `
            </ul>
            <p>
                <a href="${release.html_url}">
                    View Release Notes
                </a>
            </p>
        `;

            container.innerHTML = html;

        } catch (err) {
            container.innerHTML =
                "<p>Unable to load the latest release.</p>";
            console.error(err);
        }
    }

    loadLatestRelease();
</script>
