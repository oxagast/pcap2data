<style>
    body {
        background-color: #343359;
        color: #e0e0e0;
        line-height: 1.75;
    }

    #downloads {
        text-align: center;
        margin-top: 1rem;
        margin-bottom: 1rem;
        height: 200px;
    }

    .wrapper {
        max-width: 1600px;
        margin: 0 auto;
    }

    .wrapper-main {
        max-width: 1600px;
        margin: 0 auto;
    }


    .header {
        text-align: center;
        max-width: 1600px;
        margin: 0 auto;
        height: 245px;
    }

    a,
    a:visited,
    a:active {
        color: #7C90A0;
        /* color: #d9dde0; */
    }

    /* Increase vertical breathing room for long-form docs content. */
    p,
    ul,
    ol,
    table,
    blockquote,
    pre {
        margin-top: 1rem;
        margin-bottom: 1.25rem;
    }

    table {
        border-collapse: collapse;
        border: 1px solid #4f73aa;
        background-color: rgba(72, 105, 156, 0.16);
    }

    th,
    td {
        border: 1px solid #4f73aa;
        padding: 0.55rem 0.8rem;
    }

    th {
        background-color: rgba(92, 129, 188, 0.28);
    }

    h2,
    h3,
    h4 {
        margin-bottom: 1rem;
        line-height: 1.35;
    }

    h2 {
        margin-top: 3.25rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    h3 {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    h4 {
        margin-top: 2rem;
    }

    h2:first-of-type,
    h3:first-of-type {
        border-top: none;
        padding-top: 0;
    }

    hr {
        margin: 0.5rem 0;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    /* Right align the github link */
    .github-link {
        text-align: right;
    }
</style>
<header>
    <div class="header">
        <a href="https://packetsnitch.com/"><img width="360" height="60" alt="PacketSnitch by oxasploits"
                src="https://raw.githubusercontent.com/oxasploits/PacketSnitch/refs/heads/main/logo/ps-tagline-flicker.gif"></a>
        <br>
        <h5><i>Documentation for the PacketSnitch project</i></h5>
        {% include nav.html %}

        <div id="downloads">Loading latest release...</div>

        <script>
            async function loadLatestRelease() {
                const owner = "oxasploits";
                const repo = "PacketSnitch";

                const container = document.getElementById("downloads");

                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${owner}/${repo}/releases/latest`
                    );

                    if (!response.ok) {
                        throw new Error(`GitHub API returned ${response.status}`);
                    }

                    const release = await response.json();

                    // Build download links
                    let deb = "";
                    let rpm = "";
                    let exe = "";

                    for (const asset of release.assets) {
                        const name = asset.name.toLowerCase();

                        if (name.endsWith(".deb")) {
                            deb = `<a href="${asset.browser_download_url}">Debian (.deb)</a>`;
                        }
                        else if (name.endsWith(".rpm")) {
                            rpm = `<a href="${asset.browser_download_url}">Fedora (.rpm)</a>`;
                        }
                        else if (name.endsWith(".exe")) {
                            exe = `<a href="${asset.browser_download_url}">Windows (.exe)</a>`;
                        }
                    }

                    // Only include links that actually exist
                    const links = [deb, rpm, exe].filter(Boolean).join(" ");

                    container.innerHTML = `
            <h5><i>Latest Release:</i> ${release.tag_name}</h5>
            ${links}`;

                } catch (err) {
                    console.error(err);
                    container.innerHTML = "<h5>Unable to load latest release.</h5>";
                }
            }

            document.addEventListener("DOMContentLoaded", loadLatestRelease);
        </script>
