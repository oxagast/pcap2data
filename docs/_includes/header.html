<style>
    /* below this line is CSS that comes with 
    the theme, inlined for speed improvement */


    *,
    *::before,
    *::after {
        box-sizing: border-box
    }

    * {
        margin: 0
    }

    html,
    body {
        height: 100%
    }

    body {
        line-height: 1.5;
        -webkit-font-smoothing: antialiased
    }

    img,
    picture,
    video,
    canvas,
    svg {
        display: block;
        max-width: 100%
    }

    input,
    button,
    textarea,
    select {
        font: inherit
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        overflow-wrap: break-word
    }

    #root,
    #__next {
        isolation: isolate
    }

    .wrapper-main,
    .wrapper-header,
    .wrapper-footer {
        width: 100%;
        margin: 0 auto;
        max-width: 900px
    }

    .wrapper {
        min-height: calc(100vh - 40px)
    }

    .wrapper-footer {
        height: 40px
    }

    html {
        font-size: 18px
    }

    body {
        font-family: "Courier New", "Helvetica", sans-serif
    }

    .padded {
        padding-top: 30px;
        padding-bottom: 30px;
        line-height: 30px
    }

    .main-content {
        padding-top: 30px;
        padding-bottom: 30px;
        line-height: 30px
    }

    div.main-content h2 {
        padding-top: 15px;
        padding-bottom: 5px
    }

    header h1,
    h5 {
        display: inline
    }

    body {
        color: #c5ccce;
        background-color: #282f3a
    }

    h1,
    h2,
    strong {
        color: #dcdede
    }

    header h5 {
        font-weight: lighter
    }

    code {
        padding: 2px 4px;
        vertical-align: text-bottom
    }

    a {
        color: #7e92a2
    }

    h1,
    h2,
    strong {
        font-weight: 500
    }

    .footer-text {
        display: block;
        position: relative;
        font-size: 14px
    }

    .header {
        padding-top: 35px
    }

    .header nav {
        padding-top: 10px;
        padding-bottom: 20px
    }

    .header nav a {
        padding-right: 3px
    }

    .float-left {
        float: left
    }

    .float-right {
        float: right
    }

    .float-center {
        text-align: center
    }

    .post-item {
        display: block;
        position: relative;
        line-height: 24px;
        padding-bottom: 5px;
        margin: 5px 0
    }

    .post-summary {
        padding-top: 30px;
        padding-bottom: 30px
    }

    .post-nav {
        padding-top: 100px;
        text-align: center
    }

    .category-summary {
        padding-top: 30px;
        padding-bottom: 30px
    }

    .category-all-nav,
    .category-header {
        display: block;
        position: relative;
        line-height: 24px;
        margin: 5px 0;
        padding-bottom: 10px;
        padding-top: 10px
    }

    .post-info {
        padding-bottom: 30px;
        margin: 20px 0 5px;
        padding-top: 20px
    }

    .post-content {
        line-height: 35px;
        padding-bottom: 50px

    .post-content h1,
    h3,

    pre {
        padding-bottom: 10px;
        padding-top: 10px

    .post-content h2 {
        padding-bottom: 20px;
        padding-top: 20px

    @media only screen and (max-width: 479px) {
        .mobile-hide {
            display: none !important
        }

        .footer-text {
            float: left !important
        }

        html {
            margin: 1em !important
        }

</style>

<header>
    <div class="header">
        <a href="https://packetsnitch.com/"><img fetchpriority="high" width="360" height="60"
                alt="PacketSnitch by oxasploits"
                src="https://raw.githubusercontent.com/oxasploits/PacketSnitch/refs/heads/main/logo/ps-tagline-flicker.gif"></a>
        {% include nav.html %}

        <div id="downloads">Loading latest release...</div>

        <script>
            async function loadLatestRelease() {
                const owner = "oxasploits";
                const repo = "PacketSnitch";

                const container = document.getElementById("downloads");

                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${owner}/${repo}/releases/latest`
                    );

                    if (!response.ok) {
                        throw new Error(`GitHub API returned ${response.status}`);
                    }

                    const release = await response.json();

                    // Build download links
                    let deb = "";
                    let rpm = "";
                    let exe = "";

                    for (const asset of release.assets) {
                        const name = asset.name.toLowerCase();

                        if (name.endsWith(".deb")) {
                            deb = `&nbsp;<a class="no_underline_dl_links" href="${asset.browser_download_url}">Debian (.deb)</a>&nbsp;`;
                        }
                        else if (name.endsWith(".rpm")) {
                            rpm = `&nbsp;<a class="no_underline_dl_links" href="${asset.browser_download_url}">Fedora (.rpm)</a>&nbsp;`;
                        }
                        else if (name.endsWith(".exe")) {
                            exe = `&nbsp;<a class="no_underline_dl_links" href="${asset.browser_download_url}">Windows (.exe)</a>&nbsp;`;
                        }
                    }

                    // Only include links that actually exist
                    const links = [deb, rpm, exe].filter(Boolean).join(" ");

                    container.innerHTML = `
            Latest Release: ${release.tag_name}<br>
            ${links}`;

                } catch (err) {
                    console.error(err);
                    container.innerHTML = "Unable to load latest release.";
                }
            }

            document.addEventListener("DOMContentLoaded", loadLatestRelease);
        </script>
